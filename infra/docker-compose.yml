version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    command: poetry run arc42gen-api
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    depends_on:
      - redis
    volumes:
      - ../packages:/app/packages
      - ../scripts:/app/scripts

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    command: poetry run arc42gen-worker
    env_file:
      - ../.env
    depends_on:
      - redis
      - backend
    volumes:
      - ../packages:/app/packages
      - ../scripts:/app/scripts

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    command: pnpm run dev
    ports:
      - "3000:3000"
    env_file:
      - ../apps/web/.env
    depends_on:
      - backend
    volumes:
      - ../apps/web:/app
      - /app/node_modules # Mount node_modules inside the container to prevent host node_modules from interfering

